name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting (clang-format 21.1.8)
        run: |
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install --quiet clang-format==21.1.8
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hxx' \
            | xargs -0 -r /tmp/cf/bin/clang-format --dry-run --Werror

  apidoc:
    name: API reference is current
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Regenerate
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build --target apidoc
      # The reference is derived from the same headers the wrappers are, so a
      # diff here means the SDK moved and docs/api-reference.md was not regenerated.
      - name: Check it is committed
        run: |
          if [ ! -f docs/api-reference.md ]; then
            echo "::error::docs/api-reference.md was not produced - the apidoc target did not write it"
            exit 1
          fi
          # --intent-to-add first: `git diff` reports nothing for an untracked
          # path and exits 0, so without this a reference that was generated but
          # never committed would pass this gate forever.
          git add --intent-to-add docs/api-reference.md
          if ! git diff --exit-code -- docs/api-reference.md; then
            echo "::error::docs/api-reference.md is stale or uncommitted - run: cmake --build build --target apidoc"
            exit 1
          fi

  build-linux:
    name: Build (Linux x86_64, ${{ matrix.cc }})
    needs: format
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both: the SDK headers are C-with-C++-isms and the binding layer
          # leans on template deduction, so the two front-ends disagree often
          # enough that one of them alone is not a check.
          - { cc: gcc, cxx: g++, pkgs: "gcc g++" }
          - { cc: clang, cxx: clang++, pkgs: "clang" }
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.pkgs }}

      # MinaModAPI and LuaJIT clones. Keyed on cmake/ because both pins live
      # there, and on the compiler because _deps holds build trees too.
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ matrix.cc }}-${{ hashFiles('cmake/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            deps-linux-${{ matrix.cc }}-${{ hashFiles('cmake/*.cmake') }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build

      - name: Assert the module exports only MinaMod_Init
        run: |
          so=build/mods/minamodlua/mod.so
          nm -D --defined-only "$so"
          if [ "$(nm -D --defined-only "$so" | awk '{print $NF}')" != MinaMod_Init ] || nm -D "$so" | grep -qi lua; then
            echo "::error::$so exports more than MinaMod_Init - cmake/mod-exports.map is not being applied"
            exit 1
          fi

      # The Lua layer is staged by a POST_BUILD step, so a broken stage would
      # ship a drop-in that loads but gives mods only the raw bindings.
      - name: Assert the drop-in is complete
        shell: bash
        run: |
          for f in minamodlua/mod.so minamodlua/mod.yc minamodlua/lua/mina/init.lua; do
            if [ ! -f "build/mods/$f" ]; then
              echo "::error::build/mods/$f is missing from the drop-in"
              exit 1
            fi
          done

      # upload the clang build, not the gcc one
      - name: Upload mod drop-in (Linux)
        if: matrix.cc == 'clang'
        uses: actions/upload-artifact@v4
        with:
          name: mods-linux-x86_64
          path: build/mods/
          if-no-files-found: error

  build-windows:
    name: Build (Windows x86_64, MSVC)
    needs: format
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe, link.exe and dumpbin.exe plus INCLUDE/LIB on PATH.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-msvc-${{ hashFiles('cmake/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            deps-windows-msvc-${{ hashFiles('cmake/*.cmake') }}-

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build

      - name: Assert the module exports only MinaMod_Init
        shell: bash
        run: |
          dll=build/mods/minamodlua/mod.dll
          # `//exports`, not `/exports`: MSYS mangles a lone leading slash into a
          # Windows path. The doubled slash survives as `/exports`.
          dumpbin //exports "$dll" | tee exports.txt
          names=$(awk '/ordinal +hint +RVA +name/ {f=1; next}
                       f && NF == 0 && seen {exit}
                       f && NF >= 4 {print $NF; seen=1}' exports.txt)
          if [ "$names" != MinaMod_Init ]; then
            echo "::error::$dll exports ${names:-<nothing parsed>}, want MinaMod_Init only"
            exit 1
          fi

      # The Lua layer is staged by a POST_BUILD step, so a broken stage would
      # ship a drop-in that loads but gives mods only the raw bindings.
      - name: Assert the drop-in is complete
        shell: bash
        run: |
          for f in minamodlua/mod.dll minamodlua/mod.yc minamodlua/lua/mina/init.lua; do
            if [ ! -f "build/mods/$f" ]; then
              echo "::error::build/mods/$f is missing from the drop-in"
              exit 1
            fi
          done

      - name: Upload mod drop-in (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: mods-windows-x86_64
          path: build/mods/
          if-no-files-found: error

  build-mingw:
    name: Compile-check (mingw-w64 cross, not shipped)
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build-win/_deps
          key: deps-mingw-${{ hashFiles('cmake/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            deps-mingw-${{ hashFiles('cmake/*.cmake') }}-

      - name: Configure
        run: |
          cmake -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw64.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-win

      - name: Assert the module exports only MinaMod_Init
        run: |
          dll=build-win/mods/minamodlua/mod.dll
          x86_64-w64-mingw32-objdump -p "$dll" > pe.txt
          sed -n '/\[Ordinal\/Name Pointer\] Table/,/^$/p' pe.txt
          names=$(awk '/\[Ordinal\/Name Pointer\] Table/ {f=1; next}
                       f && NF == 0 {exit}
                       f && /^[[:space:]]*\[/ {print $NF}' pe.txt)
          if [ "$names" != MinaMod_Init ]; then
            echo "::error::$dll exports ${names:-<nothing parsed>}, want MinaMod_Init only"
            exit 1
          fi
